# Cloudflare Pages / Workers Configuration
name = "reviewlink"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Optional: Masukkan konfigurasi Supabase untuk database cloud terdistribusi.
# Nilai rahasia sebaiknya dimasukkan lewat Cloudflare Dashboard:
# Workers & Pages -> Settings -> Environment Variables
# SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_ANON_KEY = "your-supabase-anon-key"
